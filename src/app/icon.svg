<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Recharge">
  <!-- Colors mirror the app's theme tokens in globals.css. A favicon is a
       static file, so it follows the OS color scheme, not the in-app theme
       toggle: base rules are light mode, the media query supplies dark. -->
  <style>
    .tile { fill: #f7f5f1 }
    .edge { stroke: #d8d3c8 }
    .mark { fill: #2f4f7d }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #161a1f }
      .edge { stroke: #2f3642 }
      .mark { fill: #5b8def }
    }
  </style>
  <rect class="tile" width="32" height="32" rx="7.5" />
  <rect class="edge" x=".6" y=".6" width="30.8" height="30.8" rx="7" fill="none" stroke-width="1.2" />
  <path class="mark" d="M5.5 25.5 L8.4 13 L14 18 L26.5 6.5 L20 18 L15.6 13 Z" />
</svg>
